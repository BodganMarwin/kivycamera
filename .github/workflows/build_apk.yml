name: Compilar APK Kivy Sentinel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0" buildozer

      - name: Compilar APK con Buildozer
        run: |
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          buildozer -v android debug

      - name: Diagnóstico de Error en Caso de Fallo
        if: failure()
        run: |
          echo "====================== ÚLTIMAS LÍNEAS DE ERROR ======================"
          tail -n 100 .buildozer/android/platform/build-arm64-v8a/build/other_builds/*/*.log 2>/dev/null || true
          echo "====================================================================="

      - name: Subir APK como Artefacto Descargable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KivySentinel-APK
          path: bin/*.apk
          retention-days: 14
